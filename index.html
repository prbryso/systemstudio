<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/systemstudio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Interactive learning libraries for understanding connected systems and cybersecurity consequences.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Systems Studio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Systems Studio</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Systems Studio is updated frequently while its learning libraries grow.
    // Older Flutter releases installed an offline service worker, which can
    // leave phones running a previous edition after a new site is published.
    // Remove that legacy cache before loading the current application.
    (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((item) => item.unregister()));
      }

      if ('caches' in window) {
        const legacyFlutterCaches = new Set([
          'flutter-app-cache',
          'flutter-temp-cache',
          'flutter-app-manifest'
        ]);
        const cacheNames = await caches.keys();
        await Promise.all(
          cacheNames
            .filter((name) => legacyFlutterCaches.has(name))
            .map((name) => caches.delete(name))
        );
      }

      const loader = document.createElement('script');
      loader.src = 'flutter_bootstrap.js';
      loader.async = true;
      document.body.appendChild(loader);
    })();
  </script>
</body>
</html>
